<svg width="178" height="44" viewBox="0 0 178 44" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark blue-black base -->
    <linearGradient id="bg" x1="0" y1="0" x2="178" y2="44">
      <stop offset="0%" stop-color="#030711"></stop>
      <stop offset="45%" stop-color="#050B18"></stop>
      <stop offset="75%" stop-color="#071127"></stop>
      <stop offset="100%" stop-color="#0A1022"></stop>
    </linearGradient>

    <!-- Broad blue atmosphere -->
    <radialGradient id="blueAtmosphere" cx="66%" cy="58%" r="82%">
      <stop offset="0%" stop-color="#173A91" stop-opacity=".30"></stop>
      <stop offset="25%" stop-color="#123277" stop-opacity=".24"></stop>
      <stop offset="50%" stop-color="#0D2457" stop-opacity=".16"></stop>
      <stop offset="75%" stop-color="#091738" stop-opacity=".08"></stop>
      <stop offset="100%" stop-color="#030711" stop-opacity="0"></stop>
    </radialGradient>

    <!-- Very soft blue wave -->
    <filter id="softWave" x="-30%" y="-500%" width="160%" height="1000%">
      <feGaussianBlur stdDeviation="7"></feGaussianBlur>
    </filter>

    <filter id="wideWave" x="-30%" y="-800%" width="160%" height="1600%">
      <feGaussianBlur stdDeviation="11"></feGaussianBlur>
    </filter>

    <!-- Extremely subtle wave color -->
    <linearGradient id="wave" x1="0" y1="0" x2="178" y2="0">
      <stop offset="0%" stop-color="#315CFF" stop-opacity="0"></stop>
      <stop offset="25%" stop-color="#315CFF" stop-opacity=".18"></stop>
      <stop offset="50%" stop-color="#315CFF" stop-opacity=".28"></stop>
      <stop offset="72%" stop-color="#5366FF" stop-opacity=".16"></stop>
      <stop offset="100%" stop-color="#315CFF" stop-opacity="0"></stop>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="178" height="44" rx="9" fill="url(#bg)"></rect>

  <!-- Broad blue atmosphere -->
  <rect width="178" height="44" rx="9" fill="url(#blueAtmosphere)"></rect>

  <!-- Wide, soft wave -->
  <path d="M-18 29
       C18 12, 43 10, 68 20
       C91 30, 108 31, 127 20
       C148 8, 168 12, 196 24" fill="none" stroke="#173FA8" stroke-width="7" opacity=".20" filter="url(#wideWave)"></path>

  <!-- Main diffused wave -->
  <path d="M-18 29
       C18 12, 43 10, 68 20
       C91 30, 108 31, 127 20
       C148 8, 168 12, 196 24" fill="none" stroke="#2450FF" stroke-width="3" opacity=".18" filter="url(#softWave)"></path>

  <!-- Almost invisible center of the wave -->
  <path d="M-18 29
       C18 12, 43 10, 68 20
       C91 30, 108 31, 127 20
       C148 8, 168 12, 196 24" fill="none" stroke="url(#wave)" stroke-width="0.6" opacity=".45"></path>

  <!-- Release icon -->
  <g transform="translate(14 12)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 4V12L9 19L19 9L12 2H4A2 2 0 0 0 2 4Z"></path>
    <circle cx="6.5" cy="6.5" r="1.4" fill="#fff" stroke="none"></circle>
  </g>

  <!-- Divider -->
  <rect x="42" y="10" width="1" height="24" fill="#fff" opacity=".18"></rect>

  <!-- Release -->
  <text x="54" y="28" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="-0.4">Release</text>

  <!-- Version -->
  <text x="126" y="28" fill="#fff" opacity=".58" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" letter-spacing="-0.4">1.0.0</text>
</svg>